# coturn config for the watchtower TURN relay (put on a cloud VPS with a public IP).
# Copy to /etc/turnserver.conf and change the two CHANGE_ME lines.

listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_same_as_TURN_SECRET_in_env
realm=watchtower
external-ip=CHANGE_ME_VPS_PUBLIC_IP

# UDP ports used to relay video - open these in the VPS firewall too
min-port=49160
max-port=49200

total-quota=50
stale-nonce=600
no-multicast-peers
no-cli
# Never relay into private networks on the VPS side
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
log-file=/var/log/turnserver.log
